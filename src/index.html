<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ocean View Resort System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <!-- MENU -->
    <div class="menu">
        <h2>🌊 Ocean View</h2>
        <button onclick="showSection('add')">Add Reservation</button>
        <button onclick="showSection('view')">View Reservation</button>
        <button onclick="showSection('bill')">Calculate Bill</button>
        <button onclick="showSection('edit')">Edit Reservation</button>
        <button onclick="showSection('help')">Help</button>
        <button onclick="exitSystem()">Exit</button>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <!-- ADD -->
        <div id="add" class="section">
            <h2>Add New Reservation</h2>
            <input placeholder="Reservation Number">
            <input placeholder="Guest Name">
            <input placeholder="Address">
            <input placeholder="Contact Number">
            <select>
                <option>Single</option>
                <option>Double</option>
                <option>Suite</option>
            </select>
            <input type="date">
            <input type="date">
            <button>Save</button>
        </div>

        <!-- VIEW -->
        <div id="view" class="section">
            <h2>View Reservation</h2>
            <input placeholder="Reservation Number">
            <button>Search</button>
        </div>

        <!-- BILL -->
        <div id="bill" class="section">
            <h2>Calculate & Print Bill</h2>
            <input placeholder="Reservation Number">
            <button>Generate Bill</button>
        </div>

        <!-- EDIT -->
        <div id="edit" class="section">
            <h2>Edit Reservation</h2>
            <input placeholder="Reservation Number">
            <input placeholder="New Guest Name">
            <input placeholder="New Address">
            <input placeholder="New Contact Number">
            <button>Update</button>
        </div>

        <!-- HELP -->
        <div id="help" class="section">
            <h2>Help Section</h2>
            <p>✔ Use unique reservation numbers</p>
            <p>✔ Check-in date must be before check-out</p>
            <p>✔ Verify details before saving</p>
            <p>✔ Print bill at checkout</p>
        </div>

    </div>
</div>

<script>
    function showSection(id) {
        document.querySelectorAll('.section').forEach(sec => {
            sec.style.display = 'none';
        });
        document.getElementById(id).style.display = 'block';
    }

    function exitSystem() {
        alert("System closed safely.");
        window.close();
    }

    // Default screen
    showSection('add');
</script>

</body>
</html>
